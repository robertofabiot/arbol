<style>

@keyframes bob{50%{transform:translateY(-6px)}}
.fr{position:absolute;border-radius:50%;animation:bob 3s ease-in-out infinite}
.sim{align-self:flex-start;margin-top:1.8vh;font:800 clamp(12px,2.6vh,16px) Nunito;border:0;border-radius:99px;padding:1.1vh 1.6vw;background:#ff5c8a;color:#fff;box-shadow:0 4px 0 #b32a58;cursor:pointer;animation:in .6s .9s both}
.sim.big{background:#ffd23f;color:#2b1608;box-shadow:0 4px 0 #c58f00}
#md{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(4,20,26,.9)}#md.o{display:grid}
#mb{position:relative;width:min(760px,94vw);max-height:92vh;overflow:auto;background:#0d3b44;border:2px solid #ffd23f55;border-radius:20px;padding:18px 20px}
#mb h3{font:800 clamp(17px,3.4vh,24px) 'Bricolage Grotesque',sans-serif;margin:0 40px 8px 0}#mb h3 em{font-style:normal;float:right;color:#ffd23f}
.x{position:absolute;right:12px;top:10px;width:34px;height:34px;border:0;border-radius:50%;background:#fff3;color:#fff;font-size:16px;cursor:pointer}
.sp{display:flex;gap:10px;align-items:flex-start;background:#ffffff14;border-radius:12px;padding:10px 12px;margin:8px 0;animation:in .4s both}
.sp>:first-child{font-size:1.6em;line-height:1}.sp.q{display:block}
.op{display:block;width:100%;text-align:left;margin:6px 0 0;padding:9px 12px;border:2px solid #fff4;border-radius:10px;background:transparent;color:#fff;font:700 inherit Nunito;cursor:pointer}
.op.ok{background:#2ecc71;color:#06260f;border-color:#2ecc71}.op.no{background:#ff5e4d;border-color:#ff5e4d}
.pr{height:6px;background:#fff2;border-radius:6px;margin-bottom:6px}.pr i{display:block;height:100%;background:#ff5c8a;border-radius:6px;transition:width .4s}
.fin{font-weight:800;color:#7ee081;margin:10px 0 4px}#mb .bt{margin-top:10px;box-shadow:0 4px 0 #c58f00}
.sn circle{transition:r .3s}.sn{cursor:pointer}
@media (max-aspect-ratio:1/1){
svg.st{width:100%;height:34vh}
.sl{left:4vw;right:4vw;top:34vh;bottom:60px}
.g{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<h1>Hola 👋</h1><p>¿Quieres conocer acerca del proceso de reclutamiento?</p><button class="bt" id="start">Iniciar</button><small style="position:absolute;bottom:3vh;left:0;right:0;opacity:.85;font-size:clamp(10px,2.1vh,14px);padding:0 4vw">Hecho por Melissa, Camila, Francisco, Katherine y Amalia<br>Clase de Gestión del Talento Humano · Docente: Tania Mora</small></div>

<script>
const D=[
{h:'Gestión del talento humano',p:'El madroño recién cosechado: cinco conceptos clave.',st:1,it:[['Atracción','Lograr que el talento quiera llegar: marca empleadora y propuesta de valor.'],['Reclutamiento','Convocar candidatos calificados por fuentes internas y externas.'],['Selección','Elegir a quien mejor encaja con el cargo y la cultura.'],['Onboarding','Integrar al nuevo colaborador a su rol, su equipo y la cultura.'],['Inducción','Orientación inicial sobre la empresa, el puesto y las normas.']]},
{h:'1. Ciclo de capacitación',p:'Concepto e importancia: la capacitación como proceso estratégico.',st:2,it:[['Qué es','Proceso con el que los colaboradores desarrollan conocimientos, habilidades y actitudes para desempeñar mejor sus funciones.'],['Más que cursos','Se identifica qué necesita mejorar una persona o grupo y, a partir de eso, se planifica la capacitación.'],['Proceso continuo','Cada etapa se relaciona con la siguiente y la evaluación revela nuevas necesidades: el proceso vuelve a comenzar.'],['Herramienta estratégica','Tiene un propósito definido, responde a necesidades reales y contribuye a los objetivos de la organización.']]},
{h:'Las 4 fases del ciclo',p:'Según Chiavenato, Administración de Recursos Humanos.',st:4,n:1,it:[['Detección de necesidades (DNC)','Analiza la organización, los recursos humanos y las tareas. Responde qué, quién, por qué y cuándo, y evita capacitar por capacitar.'],['Diseño del programa','Define objetivos, contenidos, participantes, métodos, recursos, tiempo y lugar: convierte la necesidad en un plan concreto.'],['Ejecución o implementación','Combina lo pedagógico, administrativo y técnico, con instructores internos o externos, para que lo aprendido pase al puesto.'],['Evaluación de resultados','Comprueba si hubo aprendizaje y cambios en el desempeño; usa Kirkpatrick y revela nuevas necesidades.']]},
{h:'2. Los 4 niveles de Kirkpatrick',p:'Creado por Don Kirkpatrick en los años 50. Clave: el fin es el principio y el ROE (retorno sobre expectativas) es el indicador final de valor.',st:5,n:1,it:[['Reacción','Satisfacción inmediata: ¿fue interesante, útil y relacionada con su trabajo? Incluye materiales, instalaciones y facilitador.'],['Aprendizaje','Conocimientos, habilidades, actitudes, confianza y compromiso adquiridos; se mide con pre-test y post-test.'],['Comportamiento','Transferencia al puesto: se aplica lo aprendido. Se observa con supervisores, evaluaciones y encuestas de seguimiento.'],['Resultados','Aporte a los objetivos de la organización: productividad, costos, ventas, errores y satisfacción del cliente.']]},
{h:'Evaluación según Chiavenato',p:'Etapa final del proceso: del diagnóstico (DNC) a la verificación de resultados en tres niveles.',st:5,it:[['Nivel organizacional','Rentabilidad, productividad, competitividad, imagen y clima organizacional.'],['Nivel de recursos humanos','Menos rotación y ausentismo; más motivación, compromiso, moral y sentido de pertenencia.'],['Nivel de las tareas','Más velocidad y calidad, menos errores, reprocesos, desperdicio y accidentes laborales.'],['Cómo comprobarlo','Exámenes antes y después del curso, supervisión directa y evaluación del desempeño.']]},
{h:'3. Tipos de capacitación',p:'Proceso educativo sistemático y de corto plazo (Chiavenato, 2007), clasificado con tres criterios.',st:6,it:[['Uso: orientadas al contenido','Transmiten conocimientos: conferencias, lecturas guiadas, instrucción programada.'],['Uso: orientadas al proceso','Cambian actitudes y habilidades sociales: role-playing, entrenamiento de la sensibilidad, grupos de discusión.'],['Uso: técnicas mixtas','Mezclan información y práctica: estudio de casos, juegos gerenciales, simulaciones, talleres.'],['Según el tiempo','Antes del ingreso (inducción o integración) y después del ingreso (formación en servicio).'],['Según el lugar','En el puesto (on the job): se aprende mientras se trabaja. Fuera del puesto (off the job): aulas, seminarios, entornos virtuales.']]},
{h:'Capacitación en línea (e-learning)',p:'Uso de tecnologías de red para diseñar, entregar y gestionar el aprendizaje, sin barreras de espacio ni tiempo.',st:6,it:[['Sincrónica','Interacción en tiempo real: videoconferencias, webinars y chats.'],['Asincrónica','Contenidos en una plataforma (LMS) para avanzar a tu ritmo y en tu horario.'],['B-learning','Aprendizaje híbrido: aula presencial más recursos y evaluaciones en plataforma.'],['Ventajas','Menos costos de viajes y salas, flexibilidad y alcance global, contenido estandarizado y seguimiento del progreso.'],['Desventajas','Sin contacto presencial, distracciones que exigen autodisciplina y altos costos iniciales de desarrollo.']]},
{h:'4. Desarrollo estratégico de personal',p:'De los movimientos puntuales al largo plazo.',st:7,it:[['Promoción','Movimiento a un puesto de mayor nivel o responsabilidad; se decide por desempeño, conocimientos, experiencia, capacitación y capacidad.'],['Traslado','Cambio de puesto, área o departamento sin ascenso necesario: cubre vacantes, reorganiza o aprovecha habilidades.'],['Plan de carrera','Situación actual, oportunidades, acciones de desarrollo y seguimiento. El colaborador participa; la organización da condiciones.'],['Plan de sucesión','Identifica puestos clave y personas con potencial, para que la salida de alguien no afecte a la organización.'],['Mapa de talento','Organiza desempeño, competencias y potencial; se vincula con el banco de talentos de Chiavenato.'],['Impacto','Lo puntual responde al presente y la carrera y sucesión al futuro: mejoran retención y clima si los criterios son claros y transparentes.']]},
{h:'5. Tendencias de la capacitación',p:'Del evento puntual a una práctica continua.',st:7,it:[['Microlearning','Cápsulas de 5 a 10 minutos que refuerzan sin frenar la operación.'],['Gamificación','Rankings, desafíos e insignias que suben el compromiso.'],['Aprendizaje social','Mentorías, comunidades y proyectos colaborativos.'],['IA adaptativa','Rutas personalizadas según progreso, fortalezas y dificultades.'],['Aprendizaje inmersivo','VR, AR y realidad mixta para practicar sin riesgo.']]},
{h:'Educación corporativa',p:'Aprendizaje atado a la visión y los objetivos del negocio.',st:7,it:[['Concepto','Sistema estructurado que vincula el aprendizaje con la visión, la cultura y los objetivos del negocio.'],['Evolución','De la etapa reactiva (cursos aislados) a la estratégica (ecosistemas continuos).'],['Alcance','Formación continua, reskilling y upskilling, líderes, gestión del cambio y clima.'],['Universidad corporativa','Plataforma que gestiona y difunde el conocimiento clave para las metas del negocio.'],['Frente a la tradicional','Enfoque estratégico y de largo plazo, no cursos reactivos para tareas puntuales.'],['Ventaja competitiva','La formación deja de ser gasto y pasa a ser inversión que impulsa el crecimiento.']]},
{h:'Las semillas: referencias',p:'',st:7,it:[['Chiavenato','Chiavenato, I. (2000). Administración de recursos humanos (5.ª ed.). McGraw-Hill Interamericana. Chiavenato (2007).'],['Capacitación y evaluación','<a href="https://www.kirkpatrickpartners.com/wp-content/uploads/2024/04/el-modelo-kirkpatrick-como-mejorar-la-capacitacion-creando-valorrh.pdf">Kirkpatrick Partners (s. f.), El modelo Kirkpatrick</a> · <a href="https://repositorio.scalahed.com/recursos/files/r171r/w27554w/CapacitacionyDesarrollodelTalentoHumano_Ant_B2_C.pdf">Scala Learning, Capacitación y desarrollo del talento humano</a>'],['Modalidades','Alles (2006); Dolan et al. (2007); Universidad Insurgentes (s. f.); <a href="https://www.ispring.es/blog/what-is-elearning/amp">iSpring (2021)</a>'],['Tendencias','Cursalab (2024), <a href="https://cursalab.io/blog/7-tendencias-de-capacitacion-en-el-2025/">7 tendencias de capacitación en el 2025</a>; Red de RRHH (2026), <a href="https://redderrhh.com/5-tendencias-que-estan-redefiniendo-la-capacitacion-en-2026/">5 tendencias que redefinen la capacitación</a>'],['Educación corporativa','CognosOnline, <a href="https://cognosonline.com/universidad-corporativa/">Universidad corporativa</a>; isEazy, <a href="https://www.iseazy.com/es/glosario/educacion-corporativa/">Educación corporativa</a>']]}
,{h:'',p:'',st:7,it:[]}
];
const C=['#ff5e4d','#ffa13d','#ff6b9a','#ffd23f','#7ee081'];
const deck=document.getElementById('deck'),dots=document.getElementById('dots');
D.forEach((d,i)=>{const s=document.createElement('section');s.className='sl';s.style.setProperty('--c',C[i%5]);
s.innerHTML=`<h2>${d.h}</h2><p class="sub">${d.p}</p><div class="g ${d.it.length<4?'one':''}">`+d.it.map((t,j)=>`<div class="it" style="--k:${C[j%5]};--i:${j}"><b>${d.n?`<i>${j+1}</i>`:''}${t[0]}</b><span>${t[1]}</span></div>`).join('')+'</div>'+(i<10?`<button class="sim" onclick="sim(${i})">▶ Simular esta etapa</button>`:i>10?'':`<button class="sim big" onclick="mapa()">¿Quieres ver cómo se vería el reclutamiento y la capacitación?</button>`);
deck.appendChild(s);dots.appendChild(document.createElement('i'))});
deck.lastChild.style.setProperty('--c','#ff5c8a');
deck.lastChild.innerHTML=`<h2>Gracias por recorrer el madroño</h2><blockquote style="margin:2.4vh 0;padding:0 0 0 1.2vw;border-left:5px solid #ffd23f;font:italic 600 clamp(15px,3.6vh,26px)/1.35 'Bricolage Grotesque',Nunito,sans-serif;animation:in .7s .2s both">“Como el madroño, árbol nacional de Nicaragua, el talento echa raíces en la tierra que lo acoge, resiste todas las estaciones y florece cuando alguien se toma el tiempo de cuidarlo.”</blockquote><div class="it" style="--k:#ffd23f;--i:2"><b>Hecho por Melissa, Camila, Francisco, Katherine y Amalia</b><span>Clase de Gestión del Talento Humano · Docente: Tania Mora</span></div>`;
const T=document.getElementById('T'),NS='http://www.w3.org/2000/svg';
let seed=7;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
const add=(s,h,ox,oy)=>{const g=document.createElementNS(NS,'g');g.setAttribute('class','p');g.dataset.s=s;
